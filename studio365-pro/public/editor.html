<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Studio365 Editor</title>
  <style>
    html,body,#editor{width:100%;height:100%;margin:0;overflow:hidden;background:#f3f3f3}
    .loading{position:fixed;inset:0;display:grid;place-items:center;font:16px system-ui;background:#fff;z-index:5}
    .error{max-width:620px;padding:28px;border:1px solid #ddd;border-radius:14px;box-shadow:0 10px 32px #0001}
    .error h1{margin-top:0}
  </style>
</head>
<body>
  <div id="loading" class="loading">Opening your file…</div>
  <div id="editor"></div>
  <script src="/assets/editor.js" type="module"></script>
</body>
</html>
