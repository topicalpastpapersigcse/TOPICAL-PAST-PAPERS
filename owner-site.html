<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>Owner Access | Topical IGCSE</title>
  <style>
    html,body{height:100%;margin:0;background:#050914;color:#fff;font-family:Inter,Arial,sans-serif}
    #gate{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .card{width:min(540px,100%);padding:28px;border:1px solid #25415e;border-radius:22px;background:linear-gradient(145deg,#081624,#0b2331);box-shadow:0 24px 70px rgba(0,0,0,.4);text-align:center}
    .badge{display:inline-block;padding:7px 11px;border-radius:999px;background:#103c32;color:#75f3cc;font-size:11px;font-weight:800;letter-spacing:.12em}
    h1{margin:16px 0 10px;font-size:30px}p{color:#a9bdd0;line-height:1.6}
    input{box-sizing:border-box;width:100%;margin-top:10px;padding:14px 16px;border-radius:12px;border:1px solid #31526f;background:#071421;color:#fff;font-size:14px;outline:none}
    button{margin-top:10px;width:100%;min-height:52px;border:0;border-radius:13px;background:linear-gradient(100deg,#36d6ae,#36a8ff);color:#06111c;font-weight:900;font-size:15px;cursor:pointer}
    #status{margin-top:14px;font-size:12px;color:#9fb4c7;min-height:18px}
    #site{display:none;width:100%;height:100%;border:0;background:#050914}
  </style>
</head>
<body>
  <section id="gate">
    <div class="card">
      <span class="badge">OWNER ACCESS</span>
      <h1>Topical IGCSE Owner Portal</h1>
      <p>This portal now unlocks the website directly. No Google sign-in and no 30-day payment check.</p>
      <input id="ownerKeyInput" type="password" autocomplete="off" placeholder="Owner key">
      <button id="unlock" type="button">Unlock my full website</button>
      <div id="status">Checking owner link…</div>
    </div>
  </section>
  <iframe id="site" title="Topical IGCSE website"></iframe>

  <script>
    (() => {
      const OWNER_STORAGE_KEY = 'igcse-study-hub-owner-access-v1';
      const OWNER_ACCESS_HASH = 'e1baa239f83a871f68397c89fa9cc1218d16b32d54fc1b9b537a2b2b6767d0dd';
      const gate = document.getElementById('gate');
      const frame = document.getElementById('site');
      const input = document.getElementById('ownerKeyInput');
      const button = document.getElementById('unlock');
      const status = document.getElementById('status');

      async function sha256(text){
        const bytes = new TextEncoder().encode(String(text || ''));
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2,'0')).join('');
      }

      function saveOwnerAccess(){
        localStorage.setItem(OWNER_STORAGE_KEY, OWNER_ACCESS_HASH);
        localStorage.setItem('igcse-premium-visual-cache-v1', JSON.stringify({
          expiry:'2099-12-31T23:59:59Z',
          source:'owner_access'
        }));
      }

      function patchSite(){
        try {
          const w = frame.contentWindow;
          if (!w) return;
          w.localStorage.setItem(OWNER_STORAGE_KEY, OWNER_ACCESS_HASH);
          w.localStorage.setItem('igcse-premium-visual-cache-v1', JSON.stringify({expiry:'2099-12-31T23:59:59Z',source:'owner_access'}));
          w.eval(`
            try {
              window.isOwnerAccessActive = function(){ return true; };
              if (typeof isPremiumActive === 'function') {
                isPremiumActive = function(){ return true; };
              }
              if (typeof profile !== 'undefined') {
                profile = Object.assign({}, profile || {}, {
                  premium_source:'owner_account',
                  paypal_transaction_id:'OWNER_ACCOUNT',
                  premium_until:'2099-12-31T23:59:59Z'
                });
              }
              if (typeof updatePaymentUI === 'function') updatePaymentUI();
              if (typeof currentSubject !== 'undefined' && currentSubject && typeof renderSubjectPage === 'function') {
                renderSubjectPage(currentSubject);
              } else if (typeof renderDashboardSubjects === 'function') {
                renderDashboardSubjects(document.getElementById('globalSearch')?.value || '');
              }
              document.getElementById('premiumDialog')?.close?.();
            } catch(e) { console.error('Owner unlock patch failed', e); }
          `);
        } catch(e) { console.error(e); }
      }

      function openSite(){
        saveOwnerAccess();
        gate.style.display='none';
        frame.style.display='block';
        frame.src=`index.html?build=41&owner_view=1&t=${Date.now()}`;
      }

      async function tryKey(key){
        status.textContent='Verifying owner access…';
        try {
          if ((await sha256(key)) !== OWNER_ACCESS_HASH) {
            status.textContent='That owner key is not valid.';
            return false;
          }
          status.textContent='Owner access verified. Opening full website…';
          openSite();
          return true;
        } catch(e) {
          console.error(e);
          status.textContent='Owner access could not be verified in this browser.';
          return false;
        }
      }

      frame.addEventListener('load', () => {
        patchSite();
        setTimeout(patchSite, 100);
        setTimeout(patchSite, 400);
        setTimeout(patchSite, 1200);
      });

      button.addEventListener('click', () => tryKey(input.value.trim()));
      input.addEventListener('keydown', e => { if (e.key === 'Enter') button.click(); });

      const url = new URL(location.href);
      const key = url.searchParams.get('owner_key');
      if (key) {
        input.value = key;
        url.searchParams.delete('owner_key');
        try { history.replaceState({},'',`${url.pathname}${url.search}${url.hash}`); } catch {}
        tryKey(key);
      } else if (localStorage.getItem(OWNER_STORAGE_KEY) === OWNER_ACCESS_HASH) {
        status.textContent='Owner access already saved on this browser. Opening…';
        openSite();
      } else {
        status.textContent='Paste your owner key or use your private owner link.';
      }
    })();
  </script>
</body>
</html>
